<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer Eligibility Checker — Simulation</title>
<!--
  SIMULATION of a Streamlit application. Single file, no build step, no network.
  All data is invented and generated from a fixed seed.

  Layout, labels, column headers, badges, validation text, state names and
  business rules are copied from the real source. Each rule cites its source
  file inline. Source files referenced:
    app.py
    engine/database.py
    engine/admin_panel.py
    engine/microzen_batch_runner.py
    engine/login.py
    engine/member_profile.py
    engine/input_resolver.py
    tasks/microzen_parser.py
    tasks/transfer_eligibility_logic.py

  No CDN libraries are used. The brief allowed Alpine/Chart.js/SheetJS from a
  CDN but also required the page to work offline from file:// with no console
  errors; those two cannot both hold, so charts are hand-rolled inline SVG and
  the uploader parses CSV natively.
-->
<style>
/* ── Palette and chrome copied from app.py:75-400 ───────────────────── */
:root{
  --ink:#0f172a; --ink-2:#1e293b; --ink-3:#334155;
  --muted:#64748b; --muted-2:#94a3b8; --line:#e2e8f0; --line-2:#f1f5f9;
  --accent:#2563eb; --accent-dk:#1e40af; --teal:#0d9488;
  --green-bg:#d1fae5; --green-tx:#065f46; --green-2:#059669;
  --red-bg:#fee2e2;   --red-tx:#991b1b;   --red-2:#dc2626;
  --amber-bg:#fef3c7; --amber-tx:#92400e; --amber-2:#d97706;
  --blue-bg:#dbeafe;  --violet-bg:#ede9fe; --violet-tx:#5b21b6;
  --page:#f8fafc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--page); color:var(--ink); font-size:15px; line-height:1.5;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Top bar (demo chrome, not part of the real app) ─────────────────── */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:.9rem;
  background:#0b1220;border-bottom:1px solid var(--ink-2);padding:.55rem 1rem;color:#e2e8f0;flex-wrap:wrap;
}
.topbar-tag{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#bae6fd;padding:.2rem .6rem;border-radius:20px}
.topbar-title{font-weight:700;font-size:.86rem;color:#f1f5f9}
.topbar-spacer{flex:1}
.topbar label{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);font-weight:700;margin-right:.35rem}
.topbar select,.topbar button{
  background:var(--ink-2);border:1px solid var(--ink-3);color:#f1f5f9;border-radius:8px;padding:.35rem .6rem;font-size:.8rem;cursor:pointer;
}
.topbar button:hover,.topbar select:hover{border-color:#475569}
.role-pill{font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:20px;background:var(--blue-bg);color:var(--accent-dk)}

/* ── App header (app.py:113-166) ─────────────────────────────────────── */
.app-header{
  background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#0d4f6b 100%);
  padding:1.8rem 2.2rem;border-radius:20px;color:#fff;margin-bottom:1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  box-shadow:0 20px 60px rgba(15,23,42,.25);
}
.app-header-left{flex:1;min-width:260px}
.app-header-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#bae6fd;
  font-size:.72rem;font-weight:700;padding:.25rem .75rem;border-radius:20px;display:inline-block;
  margin-bottom:.6rem;letter-spacing:.06em;text-transform:uppercase}
.app-header-title{font-size:1.85rem;font-weight:800;margin-bottom:.35rem;letter-spacing:-.02em}
.app-header-subtitle{font-size:.92rem;color:var(--muted-2);max-width:820px;line-height:1.55}
.app-header-right{display:flex;gap:.7rem;flex-wrap:wrap}
.app-header-stat{background:rgba(255,255,255,.08);border-radius:10px;padding:.5rem 1rem;border:1px solid rgba(255,255,255,.12)}
.app-header-stat-label{font-size:.68rem;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em}
.app-header-stat-value{font-size:1.1rem;font-weight:700;color:#f0f9ff}
.hdr-flag{background:#fee2e2;color:#991b1b;font-size:.72rem;font-weight:700;padding:.2rem .7rem;border-radius:20px;margin-left:.6rem;white-space:nowrap}

/* ── Step indicator (app.py:168-211) ─────────────────────────────────── */
.steps-bar{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.5rem;margin-bottom:1.4rem;box-shadow:0 4px 16px rgba(15,23,42,.06);overflow-x:auto}
.step-item{display:flex;align-items:center;flex:1;min-width:150px}
.step-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.88rem;flex-shrink:0}
.step-circle.done{background:var(--teal);color:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.step-circle.active{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.step-circle.pending{background:var(--line-2);color:var(--muted-2);border:2px solid var(--line)}
.step-label{margin-left:.55rem;flex:1}
.step-label-main{font-size:.82rem;font-weight:700;color:var(--ink)}
.step-label-main.pending-text{color:var(--muted-2)}
.step-label-sub{font-size:.72rem;color:var(--muted-2)}
.step-connector{flex:0 0 32px;height:2px;background:var(--line);margin:0 .5rem}
.step-connector.done{background:var(--teal)}

/* ── Metric cards (app.py:213-230) ───────────────────────────────────── */
.metric-row{display:flex;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap}
.metric-card{flex:1;min-width:165px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:1.1rem 1.3rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.metric-card-label{font-size:.73rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.metric-card-value{font-size:1.55rem;font-weight:800;color:var(--ink)}
.metric-card-sub{font-size:.76rem;color:var(--muted-2);margin-top:.2rem;word-break:break-word}
.metric-card.green{border-left:4px solid var(--teal)}
.metric-card.blue{border-left:4px solid var(--accent)}
.metric-card.amber{border-left:4px solid var(--amber-2)}
.metric-card.red{border-left:4px solid var(--red-2)}
.metric-card.slate{border-left:4px solid var(--muted)}

/* ── Section cards (app.py:232-251) ──────────────────────────────────── */
.section-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.4rem 1.6rem;
  margin-bottom:1rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.section-card-title{font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:.25rem}
.section-card-sub{font-size:.82rem;color:var(--muted);margin-bottom:1rem}

/* ── Badges (app.py:253-265) ─────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:.22rem .7rem;
  border-radius:20px;letter-spacing:.03em}
.badge-green{background:var(--green-bg);color:var(--green-tx)}
.badge-red{background:var(--red-bg);color:var(--red-tx)}
.badge-amber{background:var(--amber-bg);color:var(--amber-tx)}
.badge-blue{background:var(--blue-bg);color:var(--accent-dk)}
.badge-slate{background:var(--line-2);color:#475569}

/* ── Result summary cards (app.py:267-287) ───────────────────────────── */
.result-summary-grid{display:flex;gap:1rem;margin:1rem 0;flex-wrap:wrap}
.result-summary-card{flex:1;min-width:130px;border-radius:14px;padding:1rem 1.2rem;text-align:center}
.result-summary-card.eligible{background:var(--green-bg);border:1px solid #6ee7b7}
.result-summary-card.not-eligible{background:var(--red-bg);border:1px solid #fca5a5}
.result-summary-card.error{background:var(--amber-bg);border:1px solid #fcd34d}
.result-summary-card.total{background:#eff6ff;border:1px solid #93c5fd}
.result-summary-number{font-size:2rem;font-weight:800}
.result-summary-label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:.2rem}
.result-summary-card.eligible .result-summary-number{color:var(--green-tx)}
.result-summary-card.eligible .result-summary-label{color:var(--green-2)}
.result-summary-card.not-eligible .result-summary-number{color:var(--red-tx)}
.result-summary-card.not-eligible .result-summary-label{color:var(--red-2)}
.result-summary-card.error .result-summary-number{color:var(--amber-tx)}
.result-summary-card.error .result-summary-label{color:var(--amber-2)}
.result-summary-card.total .result-summary-number{color:var(--accent-dk)}
.result-summary-card.total .result-summary-label{color:var(--accent)}

/* ── Credential panel (app.py:289-307) ───────────────────────────────── */
.credential-panel{background:var(--ink);border:1px solid var(--ink-2);border-radius:14px;padding:1.3rem 1.5rem;margin-bottom:1rem}
.credential-panel-title{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:.9rem;display:flex;align-items:center;gap:.4rem}
.credential-panel input{background:var(--ink-2);border:1px solid var(--ink-3);color:#f1f5f9;border-radius:8px;
  padding:.5rem .7rem;width:100%}
.credential-panel input::placeholder{color:#64748b}
.credential-panel .cap{font-size:.76rem;color:var(--muted);margin-top:.6rem}

/* ── Empty / welcome states (app.py:320-400) ─────────────────────────── */
.empty-state{text-align:center;padding:3rem 2rem;color:var(--muted-2)}
.empty-state-icon{font-size:3rem;margin-bottom:.8rem}
.empty-state-title{font-size:1.05rem;font-weight:700;color:#475569;margin-bottom:.4rem}
.empty-state-sub{font-size:.88rem}
.welcome-grid{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.welcome-card{flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:1.5rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.welcome-step-num{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-weight:800;font-size:1rem;margin-bottom:.8rem}
.welcome-step-num.s1{background:#eff6ff;color:var(--accent)}
.welcome-step-num.s2{background:#f0fdf4;color:var(--green-2)}
.welcome-step-num.s3{background:#fefce8;color:var(--amber-2)}
.welcome-step-num.s4{background:#fdf4ff;color:#9333ea}
.welcome-card-title{font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:.3rem}
.welcome-card-desc{font-size:.82rem;color:var(--muted);line-height:1.5}

/* ── Shell ───────────────────────────────────────────────────────────── */
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 44px)}
.sidebar{width:310px;flex:0 0 310px;background:var(--ink);border-right:1px solid var(--ink-2);
  padding:1.1rem 1rem 3rem;color:#e2e8f0;align-self:stretch;position:sticky;top:44px;max-height:calc(100vh - 44px);overflow-y:auto}
.main{flex:1;min-width:0;padding:1.5rem 1.6rem 4rem;max-width:1560px}
.sb-brand{display:flex;align-items:center;gap:.6rem;padding-bottom:.9rem;border-bottom:1px solid var(--ink-2);margin-bottom:.9rem}
.sb-brand-mark{font-size:1.5rem}
.sb-brand-name{font-weight:800;color:#f1f5f9;font-size:.98rem}
.sb-brand-sub{font-size:.7rem;color:var(--muted-2)}
.sb-group-label{display:flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:700;color:var(--muted-2);
  text-transform:uppercase;letter-spacing:.06em;margin:1.1rem 0 .5rem}
.sb-line{flex:1;height:1px;background:var(--ink-2)}
.sb-hint{font-size:.74rem;color:var(--muted-2);line-height:1.45}
.sb-status{background:#111c33;border:1px solid var(--ink-2);border-radius:10px;padding:.6rem .7rem;margin-bottom:.4rem}
.sb-status-row{display:flex;align-items:center;gap:.45rem;padding:.16rem 0;font-size:.76rem}
.sb-status-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.sb-status-dot.on{background:#10b981}
.sb-status-dot.off{background:#475569}
.sb-status-label{color:var(--muted-2);flex:0 0 92px}
.sb-status-value{color:#f1f5f9;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar label.fld{display:block;font-size:.72rem;font-weight:700;color:var(--muted-2);text-transform:uppercase;
  letter-spacing:.04em;margin:.6rem 0 .25rem}
.sidebar input[type=text],.sidebar input[type=number],.sidebar select{
  width:100%;background:var(--ink-2);border:1px solid var(--ink-3);color:#f1f5f9;border-radius:8px;padding:.42rem .6rem;font-size:.84rem}
.sidebar .radio-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.3rem}
.seg{display:flex;background:var(--ink-2);border:1px solid var(--ink-3);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;background:transparent;border:0;color:var(--muted-2);padding:.36rem .5rem;border-radius:7px;
  font-size:.78rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.opt{display:flex;align-items:center;gap:.45rem;font-size:.82rem;color:#cbd5e1;padding:.2rem 0;cursor:pointer}
.chiplist{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.chip{font-size:.7rem;background:var(--ink-2);border:1px solid var(--ink-3);color:#cbd5e1;border-radius:20px;
  padding:.16rem .55rem;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:#1d4ed8;border-color:#2563eb;color:#fff}
.dropzone{border:1px dashed var(--ink-3);background:var(--ink-2);border-radius:12px;padding:.85rem;text-align:center;
  font-size:.78rem;color:var(--muted-2);cursor:pointer}
.dropzone.drag{border-color:var(--accent);background:#17233c;color:#bfdbfe}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:9px;padding:.5rem .9rem;
  font-size:.85rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:#cbd5e1}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:var(--red-2);border-color:var(--red-2);color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sidebar .btn{background:var(--ink-2);border-color:var(--ink-3);color:#e2e8f0}
.sidebar .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Tabs ────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.1rem;overflow-x:auto;padding-bottom:1px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:.6rem .85rem;
  font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--ink);background:#f1f5f9}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:#eff6ff}

/* ── Tables ──────────────────────────────────────────────────────────── */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.8rem}
thead th{position:sticky;top:0;background:var(--ink-2);color:#fff;text-align:left;font-weight:700;
  padding:.5rem .6rem;white-space:nowrap;font-size:.74rem;letter-spacing:.02em;z-index:1}
tbody td{padding:.42rem .6rem;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:#fbfcfe}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-eligible{background:var(--green-bg);color:var(--green-tx);font-weight:700}
.cell-not-eligible{background:var(--red-bg);color:var(--red-tx);font-weight:700}
.cell-manual-review{background:var(--amber-bg);color:var(--amber-tx);font-weight:700}
.cell-error{background:#fde68a;color:var(--amber-tx)}
.sev-HIGH{background:var(--red-bg);color:var(--red-tx);font-weight:700}
.sev-MEDIUM{background:var(--amber-bg);color:var(--amber-tx)}
.sev-LOW{background:var(--line-2);color:#475569}
.st-open{background:var(--red-bg);color:var(--red-tx);font-weight:700}
.st-justification_requested{background:var(--amber-bg);color:var(--amber-tx)}
.st-justified,.st-accepted{background:var(--green-bg);color:var(--green-tx)}
.st-escalated{background:var(--violet-bg);color:var(--violet-tx);font-weight:700}
.m-header{background:var(--green-bg);color:var(--green-tx)}
.m-letter{background:var(--amber-bg);color:var(--amber-tx)}
.m-none{background:var(--red-bg);color:var(--red-tx);font-weight:700}
.flagcell{background:var(--red-bg);color:var(--red-tx);font-weight:700}

/* ── Misc ────────────────────────────────────────────────────────────── */
.alert{border-radius:10px;padding:.7rem .9rem;font-size:.83rem;margin-bottom:.8rem;border:1px solid}
.alert-info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.alert-warn{background:var(--amber-bg);border-color:#fcd34d;color:var(--amber-tx)}
.alert-err{background:var(--red-bg);border-color:#fca5a5;color:var(--red-tx)}
.alert-ok{background:var(--green-bg);border-color:#6ee7b7;color:var(--green-tx)}
details.exp{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:.8rem}
details.exp>summary{cursor:pointer;padding:.6rem .9rem;font-size:.85rem;font-weight:600;color:var(--ink);list-style:none}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::before{content:"▸ ";color:var(--muted)}
details.exp[open]>summary::before{content:"▾ "}
details.exp .exp-body{padding:0 .9rem .9rem}
.grid2{display:flex;gap:1rem;flex-wrap:wrap}
.grid2>*{flex:1;min-width:280px}
.fld-lab{display:block;font-size:.76rem;font-weight:700;color:#475569;margin:.55rem 0 .22rem}
input.txt,select.txt,textarea.txt{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:.45rem .6rem;
  font-size:.85rem;background:#fff;color:var(--ink)}
textarea.txt{resize:vertical}
.cap{font-size:.76rem;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line-2);font-size:.82rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;color:var(--ink);text-align:right;word-break:break-word}
.kv .v.blue{color:var(--accent);font-weight:700}
.progress{height:10px;background:var(--line-2);border-radius:20px;overflow:hidden;margin:.5rem 0}
.progress>span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.feed{font-size:.82rem;line-height:1.75;max-height:220px;overflow:auto;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:.5rem}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0}
.bars .b i{display:block;border-radius:3px 3px 0 0}
.bars .b b{font-size:.6rem;color:var(--muted-2);text-align:center;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:.9rem;font-size:.74rem;color:var(--muted);margin-top:.4rem;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.25rem}
footer.sim{padding:1.2rem 1.6rem 2rem;color:var(--muted);font-size:.8rem;text-align:center;border-top:1px solid var(--line);background:#fff}

/* ── Guided tour ─────────────────────────────────────────────────────── */
.tour-highlight{position:relative;z-index:55;outline:3px solid #2563eb;outline-offset:4px;border-radius:12px;
  box-shadow:0 0 0 9999px rgba(15,23,42,.45)}
.tourbox{position:fixed;right:16px;bottom:16px;width:330px;max-width:calc(100vw - 32px);z-index:70;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(15,23,42,.28);overflow:hidden}
.tourbox header{background:var(--ink);color:#fff;padding:.6rem .85rem;display:flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:700}
.tourbox header .n{background:rgba(255,255,255,.14);border-radius:20px;padding:.1rem .5rem;font-size:.7rem}
.tourbox .body{padding:.85rem;font-size:.84rem;color:#334155}
.tourbox .body h4{margin:0 0 .35rem;font-size:.9rem;color:var(--ink)}
.tourbox .foot{display:flex;gap:.4rem;padding:0 .85rem .85rem}
.tourbox .foot .btn{flex:1;padding:.4rem .5rem;font-size:.8rem}
.tourfab{position:fixed;right:16px;bottom:16px;z-index:70}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   1. SEEDED RANDOM — stable across reloads
   ═══════════════════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RNG = mulberry32(20260929);
const rnd  = () => RNG();
const ri   = (a,b) => a + Math.floor(rnd()*(b-a+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const chance = p => rnd() < p;

/* ═══════════════════════════════════════════════════════════════════════
   2. INVENTED DATA POOLS
   Every name, place, ID, balance and date below is fabricated. Nothing is
   read from the repository, its database, or any config file.
   ═══════════════════════════════════════════════════════════════════════ */

  "Ruhul Amin","Salma Chowdhury","Nazma Yeasmin","Ishrat Jahan","Farhana Kabir","Mahbub Alam",

/* Loan components are RULE CONSTANTS, not row data: they appear in the loan-row

/* Departments — app.py:1802 (6) and engine/admin_panel.py:875 (7, adds Senior Management) */

/* The real template points at the production ERP host. Replaced here so a public

/* ── Hierarchy at the scale the brief prescribes ─────────────────────── */
function buildHierarchy(){
  const divisions=[],regions=[],areas=[],branches=[],officers=[];
  let p=0;
  DIVISIONS.forEach(dv=>{
    divisions.push(dv);
    for(let r=0;r<3;r++){
      const zone = PLACES[p++ % PLACES.length] + " Zone";
      regions.push({zone:zone,division:dv});
      ["Sadar","North"].forEach(suffix=>{
        const area = zone.replace(" Zone","") + " " + suffix + " Area";
        areas.push({area:area,zone:zone,division:dv});
        for(let b=0;b<3;b++){
          const prog = b===2 ? "PMf" : "PME";
          const branch = zone.replace(" Zone","") + " " + ["Bazar","Ghat","Para"][b] + " Branch (" + prog + ")";
          branches.push({branch:branch,area:area,zone:zone,division:dv,program:(prog==="PMf"?"PMF":"PME")});
          const n = ri(4,6);
          for(let o=0;o<n;o++){
            officers.push({name:pick(STAFF),id:String(ri(1000000000,1999999999)),
                           branch:branch,area:area,zone:zone,division:dv});
          }
        }
      });
    }
  });
  return {divisions:divisions,regions:regions,areas:areas,branches:branches,officers:officers};
}
const HIER = buildHierarchy();
const officersOf = b => HIER.officers.filter(o=>o.branch===b);

/* ═══════════════════════════════════════════════════════════════════════
   3. BUSINESS RULES — copied from source, not re-invented
   ═══════════════════════════════════════════════════════════════════════ */

/* tasks/transfer_eligibility_logic.py:18  to_number() */
function toNumber(v){
  if(v===null||v===undefined) return 0;
  if(typeof v==="number") return isFinite(v)?v:0;
  let t=String(v).trim(); if(!t) return 0;
  [",","৳","Tk","BDT","tk","bdt"].forEach(tok=>{t=t.split(tok).join("");});
  const n=parseFloat(t.trim()); return isNaN(n)?0:n;
}
/* tasks/transfer_eligibility_logic.py:38  is_primary_product() */
function isPrimaryProduct(v){
  if(v===null||v===undefined) return false;
  return String(v).trim().toLowerCase().indexOf("primary")!==-1;
}
/* tasks/transfer_eligibility_logic.py:44  is_active_status()
   The green tick is often missing from the scrape, so active is inferred
   from outstanding greater than zero. */
function isActiveStatus(v,outstanding){
  outstanding = outstanding||0;
  if(v===true) return true;
  if(v===false||v===null||v===undefined) return outstanding>0;
  const t=String(v).trim().toLowerCase();
  const ACTIVE=["true","yes","y","active","1","✓","✔","green tick","green","inferred active"];
  const INACTIVE=["false","no","n","inactive","0","x","✗","✘","red cross","red"];
  if(ACTIVE.indexOf(t)!==-1) return true;
  if(INACTIVE.indexOf(t)!==-1) return false;
  return outstanding>0;
}
/* tasks/transfer_eligibility_logic.py:76  evaluate_loans()
   Both confidence flags default true so older callers stay unaffected. */
function evaluateLoans(loans, loanSectionFound, profileOk){
  if(loanSectionFound===undefined) loanSectionFound=true;
  if(profileOk===undefined) profileOk=true;
  let primaryWith="No", primaryBal=0, primaryOver=0;
  let activeCount=0, totalOut=0, totalOver=0; const details=[];
  (loans||[]).forEach(function(loan){
    const product = loan.loan_product||"";
    const outstanding = toNumber(loan.outstanding_balance);
    const overdue = toNumber(loan.overdue_amount);
    const active = isActiveStatus(loan.active_status, outstanding);
    const primary = isPrimaryProduct(product);
    if(active && outstanding>0){
      activeCount++; totalOut+=outstanding; totalOver+=overdue;
      details.push(product+" | Outstanding: "+fmt2(outstanding)+" | Overdue: "+fmt2(overdue));
    }
    if(primary && active && outstanding>0){
      primaryWith="Yes";
      primaryBal=Math.max(primaryBal,outstanding);
      primaryOver=Math.max(primaryOver,overdue);
    }
  });
  let result,confidence,message,needsReview=false,reviewReason="";
  if(primaryWith==="Yes"){
    result="Not Eligible"; confidence="High";
    message="Member is not eligible for transfer because active Primary loan with outstanding balance was found.";
  } else if(!profileOk){
    result="Manual Review"; confidence="None"; needsReview=true;
    reviewReason="Member profile could not be read reliably.";
    message="Manual review required: the member profile did not parse, so eligibility could not be determined automatically. Verify in Microzen.";
  } else if(!loanSectionFound){
    result="Manual Review"; confidence="None"; needsReview=true;
    reviewReason="Loan table was not found in the captured page.";
    message="Manual review required: the loan information could not be read, so an Eligible result cannot be trusted. Verify loans in Microzen.";
  } else {
    result="Eligible"; confidence=(loans&&loans.length)?"High":"Medium";
    message="Member is eligible for transfer based on automated pre-check. No active Primary loan with outstanding balance was found.";
    if(!loans||!loans.length){
      message+=" (Note: no loan rows were parsed — confirm the member genuinely has no loans if this is unexpected.)";
    }
  }
  return {primary_loan_with_balance:primaryWith, primary_loan_balance:primaryBal,
    primary_loan_overdue:primaryOver, active_loans_count:activeCount,
    total_outstanding:totalOut, total_overdue:totalOver,
    active_loan_details:details.join("; "), eligibility_result:result,
    result_message:message, confidence:confidence,
    needs_manual_review:needsReview, review_reason:reviewReason, status:"COMPLETED"};
}
/* engine/database.py:264  _derive_flags()
   Severity is HIGH when the overdue sits on a Primary loan, otherwise MEDIUM
   at 1000 or above and LOW below it. Both flag types can fire on one member. */
function deriveFlags(elig){
  const flags=[];
  const totalOverdue=toNumber(elig.total_overdue);
  const primaryOverdue=toNumber(elig.primary_loan_overdue);
  const result=(elig.eligibility_result||"").toLowerCase();
  if(totalOverdue>0||primaryOverdue>0){
    const amount=Math.max(totalOverdue,primaryOverdue);
    const severity = primaryOverdue>0 ? "HIGH" : (amount>=1000 ? "MEDIUM" : "LOW");
    flags.push({type:"OVERDUE_ON_TRANSFER",severity:severity,
      reason:"Member submitted for transfer has overdue balance of "+fmt2(amount)
        +(primaryOverdue>0?" on a Primary loan":"")+". Justification required from the requester."});
  }
  if(result==="not eligible"){
    flags.push({type:"NOT_ELIGIBLE_BUT_SUBMITTED",severity:"HIGH",
      reason:"Member has an active Primary loan with balance but was submitted for transfer."});
  }
  return flags;
}
/* engine/database.py:370 */
const overdueFlagOf = e => (toNumber(e.total_overdue)>0||toNumber(e.primary_loan_overdue)>0)?1:0;
/* engine/database.py:32 */
const APP_VERSION="1.0", RULE_VERSION="primary-loan-v1";
/* engine/database.py:142 — the five workflow states */
const FLAG_STATUSES=["open","justification_requested","justified","accepted","escalated"];

/* ── formatting helpers ──────────────────────────────────────────────── */
function fmt2(n){return (Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt0(n){return Math.round(+n||0).toLocaleString("en-US");}
function money(n){n=+n||0;
  if(Math.abs(n)>=1e7) return (n/1e7).toFixed(2)+" Cr";
  if(Math.abs(n)>=1e5) return (n/1e5).toFixed(2)+" L";
  return fmt0(n);}
function esc(s){return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pad(n,w){let s=String(n);while(s.length<w)s="0"+s;return s;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);}
function pct(a,b){return b?Math.round(a*1000/b)/10:0;}

/* ═══════════════════════════════════════════════════════════════════════
   4. GENERATED DATASET
   ═══════════════════════════════════════════════════════════════════════ */
let MEMBER_SEQ = 200000;
function newMemberId(){ MEMBER_SEQ += ri(37,911); return pad(MEMBER_SEQ,8); }
function memberName(){ return pick(MEMBER_FIRST)+" "+pick(MEMBER_LAST); }
function samityName(){ return pick(SAMITY_WORD)+" Mohila Shamity-"+pad(ri(1,9),2); }
function clusterName(){ return "Cluster-"+pad(ri(2,9),2)+" "+pick(SAMITY_WORD)+" Samity"; }
function phoneNo(){ return "01"+ri(3,9)+String(ri(10000000,99999999)); }

/* One transfer request row, before anything is read from the ERP. */
function makeRequest(rowNo, dateStr, requester){
  const fromBranch = pick(HIER.branches);
  const fromOffs = officersOf(fromBranch.branch);
  const fromOff = fromOffs.length?pick(fromOffs):pick(HIER.officers);
  let toBranch = pick(HIER.branches);
  let guard=0;
  while(toBranch.branch===fromBranch.branch && guard++<8) toBranch = pick(HIER.branches);
  const toOffs = officersOf(toBranch.branch);
  const toOff = toOffs.length?pick(toOffs):pick(HIER.officers);
  const raw = newMemberId();
  return {
    input_row: rowNo,
    member_id_raw: raw,
    member_id_clean: String(parseInt(raw,10)),
    member_name: memberName(),
    samity: samityName(),
    samity_id: String(ri(100000000,999999999)),
    from_officer: fromOff.name, from_officer_id: fromOff.id,
    input_branch: fromBranch.branch,
    area: fromBranch.area,
    input_region_zone: fromBranch.zone,
    division: fromBranch.division,
    program: fromBranch.program,
    to_samity: clusterName(), to_samity_id: String(ri(100000000,999999999)),
    to_officer: toOff.name, to_officer_id: toOff.id,
    to_branch: toBranch.branch, to_area: toBranch.area, to_zone: toBranch.zone,
    approver_name: pick(APPROVERS), approver_designation: pick(DESIGNATIONS),
    transfer_date: dateStr, transfer_by: requester,
    transfer_reason: pick(TRANSFER_REASONS),
    profile_url: URL_TEMPLATE.replace("{member_id_clean}", String(parseInt(raw,10)))
  };
}

/* What the scraper would read back off the rendered ERP pages.
   Shapes follow tasks/microzen_parser.py:57 (profile), :143 (loans), :207 (savings). */
function scrapeMember(req, opts){
  opts = opts||{};
  const component = pick(COMPONENTS);
  const profileOk = opts.forceProfileFail ? false : !chance(0.015);
  const loanSectionFound = opts.forceLoanFail ? false : !chance(0.03);
  const loans=[];
  if(profileOk && loanSectionFound){
    const hasPrimary = chance(opts.primaryRate===undefined?0.42:opts.primaryRate);
    if(hasPrimary){
      const amount = ri(12,60)*1000;
      const outstanding = Math.round(amount*(0.2+rnd()*0.7));
      const overdue = chance(0.55) ? Math.round(outstanding*(0.05+rnd()*0.35)) : 0;
      loans.push({loan_product:component+" Primary", loan_term:pick(["46 Kisti","23 Kisti","WEEKLY","MONTHLY"]),
        loan_amount:amount, installment_amount:Math.round(amount/46),
        total_payable:Math.round(amount*1.12), outstanding_balance:outstanding,
        overdue_amount:overdue, active_status:"Inferred Active",
        progress_text:ri(10,90)+"% Complete"});
    }
    if(chance(0.30)){
      const amount2 = ri(5,20)*1000;
      const out2 = chance(0.5)?Math.round(amount2*rnd()*0.6):0;
      loans.push({loan_product:pick(COMPONENTS)+" Secondary", loan_term:"46 Kisti",
        loan_amount:amount2, installment_amount:Math.round(amount2/46),
        total_payable:Math.round(amount2*1.1), outstanding_balance:out2,
        overdue_amount:(out2>0&&chance(0.3))?Math.round(out2*0.2):0,
        active_status: out2>0?"Inferred Active":"Inactive or Closed",
        progress_text:ri(20,99)+"% Complete"});
    }
  }
  const weekly=ri(0,40)*500, voluntary=ri(0,30)*50, monthly=ri(0,20)*250;
  const profile = profileOk ? {
    member_name:req.member_name, member_code:req.member_id_raw,
    member_status:"Active", loan_component:component, microzen_program:component,
    microzen_zone:req.input_region_zone, area:req.area,
    branch:req.input_branch, samity:req.samity, phone:phoneNo()
  } : {member_name:"",member_code:"",member_status:"",loan_component:"",microzen_program:"",
       microzen_zone:"",area:"",branch:"",samity:"",phone:""};
  const savings = {weekly_savings_balance:weekly, voluntary_savings_balance:voluntary,
    monthly_savings_balance:monthly, total_savings_balance:weekly+voluntary+monthly,
    savings_details:"Weekly Savings: "+fmt2(weekly)+"; Voluntary Savings: "+fmt2(voluntary)
                    +"; Monthly Savings: "+fmt2(monthly)};
  const eligibility = evaluateLoans(loans, loanSectionFound, profileOk);
  return {profile:profile, loans:loans, savings:savings, eligibility:eligibility,
          status:"COMPLETED", error_message:"", data_quality:{profile_ok:profileOk,loan_section_found:loanSectionFound}};
}

/* ── Historical runs. Quarter-end months carry a deliberate overdue spike,
      and two requesters repeat, so the pattern reports have something true
      to find rather than noise. ───────────────────────────────────────── */
const REPEAT_REQUESTERS = [STAFF[3], STAFF[11]];
const DB = {runs:[], checks:[], flags:[], notifications:[], audit:[], recipients:[], settings:{}};
let RUN_SEQ=0, CHECK_SEQ=0, FLAG_SEQ=0, AUDIT_SEQ=0;

function persistRun(results, operator, source, outputFile, when){
  /* mirrors engine/database.py:320 persist_run() */
  RUN_SEQ++;
  const runId=RUN_SEQ;
  const d=when||new Date();
  const runDate=iso(d), runMonth=runDate.slice(0,7), runYear=d.getFullYear();
  let eligible=0,notEligible=0,manual=0,errors=0,flaggedTotal=0;
  results.forEach(function(r){
    const e=r.eligibility||{}; const res=(e.eligibility_result||"").toLowerCase();
    if(res==="eligible") eligible++;
    else if(res==="not eligible") notEligible++;
    else if(res==="manual review") manual++;
    if(r.status==="ERROR") errors++;
    CHECK_SEQ++;
    const parts=[r.from_officer,r.input_branch].filter(Boolean);
    const partsTo=[r.to_officer,r.to_branch,r.to_samity].filter(Boolean);
    const chk={
      id:CHECK_SEQ, run_id:runId, zone:r.input_region_zone, run_date:runDate,
      run_month:runMonth, run_year:runYear, input_row:r.input_row,
      member_id_raw:r.member_id_raw, member_id_clean:r.member_id_clean,
      member_name:(r.profile&&r.profile.member_name)||r.member_name,
      member_code:(r.profile&&r.profile.member_code)||"",
      member_status:(r.profile&&r.profile.member_status)||"",
      requested_from:parts.join(" / "), requested_to:partsTo.join(" / "),
      requested_by:r.transfer_by, transfer_date:r.transfer_date,
      input_branch:r.input_branch, input_region_zone:r.input_region_zone,
      microzen_zone:(r.profile&&r.profile.microzen_zone)||"",
      area:(r.profile&&r.profile.area)||r.area,
      branch:(r.profile&&r.profile.branch)||r.input_branch,
      samity:(r.profile&&r.profile.samity)||r.samity,
      phone:(r.profile&&r.profile.phone)||"",
      loan_component:(r.profile&&r.profile.loan_component)||"",
      primary_loan_with_balance:e.primary_loan_with_balance||"",
      primary_loan_balance:e.primary_loan_balance||0,
      primary_loan_overdue:e.primary_loan_overdue||0,
      active_loans_count:e.active_loans_count||0,
      total_outstanding:e.total_outstanding||0,
      total_overdue:e.total_overdue||0,
      total_savings:(r.savings&&r.savings.total_savings_balance)||0,
      eligibility_result:e.eligibility_result||"", confidence:e.confidence||"",
      needs_manual_review:e.needs_manual_review?1:0,
      overdue_flag:overdueFlagOf(e), result_message:e.result_message||"",
      status:r.status||"", error_message:r.error_message||"",
      snapshot_folder:"logs/microzen_batch_runs/transfer_batch_"+runDate.replace(/-/g,"")+"/"+pad(r.input_row,4)+"_"+r.member_id_raw,
      created_at:runDate+"T"+pad(ri(9,18),2)+":"+pad(ri(0,59),2)+":00",
      from_officer:r.from_officer, from_officer_id:r.from_officer_id,
      to_zone:r.to_zone, to_area:r.to_area, to_branch:r.to_branch,
      to_samity:r.to_samity, to_samity_id:r.to_samity_id,
      to_officer:r.to_officer, to_officer_id:r.to_officer_id,
      approver_name:r.approver_name, transfer_reason:r.transfer_reason
    };
    DB.checks.push(chk);
    deriveFlags(e).forEach(function(f){
      FLAG_SEQ++;
      DB.flags.push({flag_id:FLAG_SEQ, run_id:runId, member_check_id:chk.id,
        member_id_raw:chk.member_id_raw, member_name:chk.member_name, zone:chk.zone,
        requested_by:chk.requested_by, type:f.type, severity:f.severity, reason:f.reason,
        status:"open", justification_text:"", justified_by:"", reviewed_by:"",
        created_at:chk.created_at, updated_at:chk.created_at, run_month:runMonth, run_year:runYear, run_date:runDate});
      flaggedTotal++;
    });
  });
  DB.runs.push({run_id:runId, started_at:runDate+"T10:00:00", finished_at:runDate+"T10:12:00",
    operator:operator, source:source, files_processed:1, total_members:results.length,
    eligible:eligible, not_eligible:notEligible, manual_review:manual, errors:errors,
    flagged:flaggedTotal, app_version:APP_VERSION, rule_version:RULE_VERSION,
    run_date:runDate, run_month:runMonth, run_year:runYear, status:"COMPLETED",
    output_file:outputFile});
  logAudit(operator,"RUN_SAVED","run_id="+runId, results.length+" members, "+flaggedTotal+" flag(s)", runDate);
  return {run_id:runId,total:results.length,eligible:eligible,not_eligible:notEligible,
          manual_review:manual,errors:errors,flagged:flaggedTotal};
}
/* Fixed "today" so seeded audit rows do not drift day to day. Live actions
   taken by the visitor still stamp the real current date via iso(new Date()). */
const DEMO_TODAY="2026-09-18";
function logAudit(actor,action,target,details,dateStr){
  AUDIT_SEQ++;
  const d=dateStr||DEMO_TODAY;
  DB.audit.push({id:AUDIT_SEQ,actor:actor,action:action,target:target,details:details,
    timestamp:d+"T"+pad(ri(9,18),2)+":"+pad(ri(0,59),2)+":"+pad(ri(0,59),2)});
}

/* Seven months of history ending last month. */
(function seedHistory(){
  const base=new Date(2026,8,18); /* fixed so the demo never drifts */
  for(let back=7;back>=1;back--){
    const d=new Date(base.getFullYear(), base.getMonth()-back, 1);
    const month=d.getMonth()+1;
    const quarterEnd=(month===3||month===6||month===9||month===12);
    const runsThisMonth = quarterEnd?2:1;
    for(let k=0;k<runsThisMonth;k++){
      /* quarter-end runs are pushed to the last week and carry more overdue */
      const day = quarterEnd ? ri(25,28) : ri(4,22);
      const when=new Date(d.getFullYear(),d.getMonth(),day);
      const n = quarterEnd?ri(16,24):ri(9,16);
      const results=[];
      for(let i=1;i<=n;i++){
        const requester = chance(quarterEnd?0.55:0.25) ? pick(REPEAT_REQUESTERS) : pick(STAFF);
        const req=makeRequest(i, iso(when), requester);
        const scraped=scrapeMember(req,{primaryRate: quarterEnd?0.62:0.38});
        results.push(Object.assign({},req,scraped));
      }
      persistRun(results, pick(STAFF), "upload",
        "output/generated_excels/transfer_eligibility_result_"+iso(when).replace(/-/g,"")+"_"+pad(ri(100000,999999),6)+".xlsx",
        when);
    }
  }
  /* a handful of flags already worked, so the workflow screen is not all "open" */
  DB.flags.forEach(function(f,i){
    if(i%9===0){ f.status="justified"; f.justification_text="Repayment plan agreed with the member before transfer."; f.reviewed_by=pick(STAFF); }
    else if(i%14===0){ f.status="escalated"; f.reviewed_by=pick(STAFF); f.justification_text="No response from the requesting officer within 3 working days."; }
    else if(i%11===0){ f.status="accepted"; f.reviewed_by=pick(STAFF); f.justification_text="Exception approved by the regional manager."; }
  });
})();

   aliases:["member id","memberid","member_id","সদস্য আইডি"]},

];
function normHeader(s){return String(s||"").toLowerCase().replace(/[\s_\-\/]+/g," ").trim();}
/* engine/input_resolver.py:119 describe_resolution() — the three states the
   resolution panel colours: header match, letter fallback, not found. */
function resolveColumns(headers){
  const norm=headers.map(normHeader);
  return FIELD_MAP.map(function(f){
    let idx=-1;
    if(S.useHeaderMatch){
      for(let i=0;i<norm.length&&idx<0;i++){
        if(f.aliases.some(a=>norm[i]===normHeader(a))) idx=i;
      }
      if(idx<0) for(let i=0;i<norm.length&&idx<0;i++){
        if(f.aliases.some(a=>norm[i].indexOf(normHeader(a))!==-1)) idx=i;
      }
    }
    let how = idx>=0 ? "Header name" : null;
    if(idx<0){
      const li=colLetterToIndex(f.col);
      if(li>=0 && li<headers.length){ idx=li; how="Column letter (fallback)"; }
      else how="NOT FOUND";
    }
    return {Field:f.label, Key:f.key, Column:(idx>=0?indexToColLetter(idx):"—"),
            "Matched by":how, _idx:idx};
  });
}
function colLetterToIndex(letters){
  let n=0; letters=String(letters).toUpperCase();
  for(let i=0;i<letters.length;i++){ n=n*26+(letters.charCodeAt(i)-64); }
  return n-1;
}
function indexToColLetter(i){
  let s=""; i=i+1;
  while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); }
  return s;
}

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r") cur+=c;
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

/* hierarchy + recipient matching, app.py apply_mapping_to_requests */
function applyMapping(rows){
  return rows.map(function(r){
    const b=HIER.branches.filter(x=>x.branch===r.input_branch)[0];
    const matched=!!b;
    const recips=DB.recipients.filter(function(x){
      return x.active===1 && S.departments.indexOf(x.department)!==-1 &&
             x.covered_zone===(b?b.zone:r.input_region_zone);
    });
    const to=recips.filter(x=>x.recipient_type==="To");
    const cc=recips.filter(x=>x.recipient_type==="CC");
    return Object.assign({},r,{
      mapped_program:b?b.program:"", mapped_division:b?b.division:"",
      mapped_region:b?b.zone:"", mapped_area:b?b.area:"", mapped_branch:b?b.branch:"",
      hierarchy_match_status: matched?"Matched":"No hierarchy match",
      recipient_names: recips.map(x=>x.person_name).join("; "),
      recipient_to: to.map(x=>x.email).join("; "),
      recipient_cc: cc.map(x=>x.email).join("; "),
      notification_departments: recips.map(x=>x.department).filter(function(v,i,a){return a.indexOf(v)===i;}).join("; "),
      recipient_match_status: recips.length?"Matched":"No focal person found"
    });
  });
}
/* app.py:975 build_email_drafts() — subject and body copied verbatim */
function buildEmailDrafts(rows){
  const grouped={};
  rows.forEach(function(r){
    const key=r.mapped_region||r.input_region_zone||"Unmapped Region";
    (grouped[key]=grouped[key]||[]).push(r);
  });
  const drafts={};
  Object.keys(grouped).forEach(function(region){
    const rs=grouped[region];
    const uniq=a=>a.filter(function(v,i,x){return v&&x.indexOf(v)===i;}).sort();
    const to=uniq([].concat.apply([],rs.map(r=>String(r.recipient_to||"").split("; "))));
    const cc=uniq([].concat.apply([],rs.map(r=>String(r.recipient_cc||"").split("; "))));
    const depts=uniq([].concat.apply([],rs.map(r=>String(r.notification_departments||"").split("; "))));
    drafts[region]={
      subject:"Transfer Eligibility Pre-Check Draft - "+region+" - "+rs.length+" Member(s)",
      to:to.join("; "), cc:cc.join("; "),
      body:"Dear Concerned,\n\nA transfer eligibility pre-check draft has been prepared for "+region+".\n\n"
        +"Summary:\nTotal request(s): "+rs.length+"\n"
        +"Notification department(s): "+(depts.length?depts.join(", "):"Not selected")+"\n"
        +"Current status: Pending Microzen check\n\n"
        +"The final eligibility decision will be generated after Microzen profile, loan, and savings data are extracted.\n\n"
        +"Important note:\nThis automation is a pre-check and review preparation tool. It is not final transfer approval.\n\n"
        +"Regards,\nTransfer Eligibility Checker\n"
    };
  });
  return drafts;
}

function wireSidebar(){
  const seg=$("#navSeg");
  if(seg) seg.querySelectorAll("button").forEach(function(b){
    b.onclick=function(){ if(b.disabled) return; S.mode=b.dataset.mode; render(); };
  });
  const drop=$("#drop"), fi=$("#fileInput");
  if(drop){
    drop.onclick=()=>fi.click();
    drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click();} };
    drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag");};
    drop.ondragleave=()=>drop.classList.remove("drag");
    drop.ondrop=function(e){ e.preventDefault(); drop.classList.remove("drag");
      if(e.dataTransfer.files&&e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); };
    fi.onchange=function(){ if(fi.files&&fi.files[0]) loadFile(fi.files[0]); };

  const ls=$("#loadSample");

    toast("Sample zone file loaded. Click Read Transfer Requests.","info");

  bind("hdrMatch","change",e=>{S.useHeaderMatch=e.target.checked;});
  bind("urlTpl","change",e=>{S.urlTemplate=e.target.value;});
  document.querySelectorAll('input[name="runmode"]').forEach(function(r){

  });
  const chips=$("#deptChips");
  if(chips) chips.querySelectorAll(".chip").forEach(function(c){
    const toggle=function(){

      if(i===-1) S.departments.push(d); else S.departments.splice(i,1);
      render();
    };
    c.onclick=toggle;
    c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();} };
  });
  bind("readBtn","click",function(){ readRequests(); render(); });
  bind("clearBtn","click",function(){
    S.requests=[];S.selected=[];S.results=[];S.summary=null;S.resolved=[];S.emailDrafts={};S.lastSaved=null;
    render();
  });
}
function loadFile(file){
  const fr=new FileReader();
  fr.onload=function(){
    try{
      const rows=parseCSV(String(fr.result));
      if(!rows.length){ toast("Cannot read file: it appears to be empty.","err"); return; }
      S.rawRows=rows; S.fileName=file.name;
      S.requests=[];S.selected=[];S.results=[];S.summary=null;S.resolved=[];
      toast("File loaded. Click Read Transfer Requests.","info");
    }catch(err){ toast("Could not read transfer requests: "+err.message,"err"); }
  };
  fr.onerror=function(){ toast("Could not read the file.","err"); };
  fr.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════════════
   10. PLAYWRIGHT SEQUENCE DIAGRAM
   Steps follow engine/microzen_batch_runner.py:59-170, engine/login.py:13,
   engine/member_profile.py:17, tasks/microzen_extractors.py:80.
   The real code has no logout: the run ends by closing the browser context
   at microzen_batch_runner.py:171, so the last node says Close session.
   ═══════════════════════════════════════════════════════════════════════ */
const PW_STEPS=[
  {id:"launch", t:"Launch Chromium",  d:"headless off by default so the operator can watch"},
  {id:"login",  t:"Login",            d:"fill username + password, click Submit"},
  {id:"verify", t:"Verify login",     d:"still on /login? fail fast with a clear message"},
  {id:"warm",   t:"Warm-up",          d:"prime the app root, 3.5s settle"},
  {id:"nav",    t:"Navigate to member",d:"goto profile URL, domcontentloaded"},
  {id:"profile",t:"Read profile",     d:"capture body text, tables, screenshot"},
  {id:"loans",  t:"Click Loans, read",d:"tab click, scroll, capture"},
  {id:"savings",t:"Click Savings, read",d:"tab click, capture"},
  {id:"parse",  t:"Parse + apply rule",d:"one retry if nothing parsed"},
  {id:"close",  t:"Close session",    d:"context.close(), browser.close()"}
];
function pwDiagram(activeId){
  let nodes="";
  PW_STEPS.forEach(function(s,i){
    const on = activeId===s.id;
    const done = activeId && PW_STEPS.findIndex(x=>x.id===activeId)>i;
    const fill = on?"#2563eb":(done?"#0d9488":"#ffffff");
    const stroke = on?"#1d4ed8":(done?"#0d9488":"#cbd5e1");
    const tx = (on||done)?"#ffffff":"#475569";
    const y = 26 + i*46;
    nodes+='<g><rect x="14" y="'+y+'" width="26" height="26" rx="13" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>'
      +'<text x="27" y="'+(y+17)+'" font-size="12" font-weight="700" fill="'+tx+'" text-anchor="middle">'+(i+1)+'</text>'
      +'<text x="52" y="'+(y+12)+'" font-size="12.5" font-weight="700" fill="#0f172a">'+esc(s.t)+'</text>'
      +'<text x="52" y="'+(y+26)+'" font-size="11" fill="#94a3b8">'+esc(s.d)+'</text>';
    if(i<PW_STEPS.length-1){
      nodes+='<line x1="27" y1="'+(y+26)+'" x2="27" y2="'+(y+46)+'" stroke="'+(done?"#0d9488":"#e2e8f0")+'" stroke-width="2"/>';
    }
    nodes+='</g>';
  });
  /* retry loop marker between parse and nav */
  nodes+='<path d="M 8 '+(26+8*46+13)+' q -7 -100 0 -190" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>'
    +'<text x="-118" y="12" transform="rotate(-90)" font-size="10" fill="#d97706">retry once</text>';
  return '<svg viewBox="0 0 430 '+(26+PW_STEPS.length*46)+'" width="100%" role="img" '
    +'aria-label="Browser automation sequence: launch, login, verify, warm up, navigate, read profile, loans and savings, parse, close session">'
    +nodes+'</svg>';
}
function pwPanel(activeId){
  return card("How the figures are obtained",

    '<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-start">'
    +'<div style="flex:1;min-width:250px">'+pwDiagram(activeId)+'</div>'

function startRun(){
  const scopeMap={"First 2 members":2,"First 5 members":5,"All selected members":null};
  const maxItems=scopeMap[S.runScope];
  const batch=maxItems?S.selected.slice(0,maxItems):S.selected.slice();
  if(!S.username||!S.password){ toast("Enter your Microzen username and password before running.","err"); return; }
  S.running=true; S.results=[]; S.summary=null; S.lastSaved=null; S.pwActive="launch";
  render();
  const prog=$("#runProgress");
  const feed=[];
  const stages=["launch","login","verify","warm"];
  let si=0;
  function paint(pctv,text){
    if(!prog) return;
    prog.innerHTML='<div class="progress"><span style="width:'+pctv+'%"></span></div>'
      +'<div class="cap" style="margin-bottom:.4rem">'+esc(text)+'</div>'
      +'<div class="feed">'+feed.slice(0,12).join("<br>")+'</div>';
    const holder=$("#pwHolder"); if(holder) holder.innerHTML=pwPanel(S.pwActive);
  }
  function boot(){
    if(si<stages.length){
      S.pwActive=stages[si];
      paint(4+si*3, {launch:"Starting browser…",login:"Logging in…",
        verify:"Confirming the session is authenticated…",
        warm:"Warm-up: priming the app root so the first member does not fail…"}[stages[si]]);
      si++; setTimeout(boot,520); return;
    }
    step(0);
  }
  function step(i){
    if(i>=batch.length){ finish(batch); return; }
    const req=batch[i];
    S.pwActive="nav";
    paint(Math.round(16+ (i/batch.length)*80), "Checking member "+(i+1)+" of "+batch.length+"  ·  ID "+req.member_id_raw);
    const sub=["profile","loans","savings","parse"];
    let k=0;
    (function inner(){
      if(k<sub.length){ S.pwActive=sub[k]; k++; paint(Math.round(16+((i+k/5)/batch.length)*80),
        "Checking member "+(i+1)+" of "+batch.length+"  ·  ID "+req.member_id_raw); setTimeout(inner,150); return; }
      const scraped=scrapeMember(req,{});
      const row=Object.assign({},req,scraped);
      S.results.push(row);
      const e=row.eligibility||{}; const res=e.eligibility_result||"";
      const icon = row.status==="ERROR"?"⚠️"
        : res==="Eligible"?"✅" : res==="Not Eligible"?"⛔"
        : res==="Manual Review"?"\u{1F50E}" : "•";
      feed.unshift(icon+"  <strong>"+esc(row.member_id_raw)+"</strong> — "
        +esc((row.profile||{}).member_name||row.member_name||row.member_id_raw)+" — "+esc(res||row.status));
      setTimeout(function(){step(i+1);},200);
    })();
  }
  function finish(batch){
    S.pwActive="close"; paint(100,"Writing output…");
    setTimeout(function(){
      S.summary={total:S.results.length,
        completed:S.results.filter(r=>r.status==="COMPLETED").length,
        errors:S.results.filter(r=>r.status==="ERROR").length, results:S.results};
      S.lastSaved=persistRun(S.results, S.username||"local-operator","upload",
        "output/generated_excels/transfer_eligibility_result_20260918_"+pad(ri(100000,999999),6)+".xlsx", new Date(2026,8,18));
      S.running=false; S.pwActive=null;
      toast("Microzen transfer eligibility check completed.","ok");
      render();
    },600);
  }
  boot();
}

function uniqSorted(arr){return arr.filter(function(v,i,a){return v&&a.indexOf(v)===i;}).sort();}
function filteredChecks(){
  const f=S.filters;
  return DB.checks.filter(function(c){
    if(f.year!=="All"   && String(c.run_year)!==f.year) return false;
    if(f.month!=="All"  && c.run_month!==f.month) return false;
    if(f.zone!=="All"   && c.zone!==f.zone) return false;
    if(f.branch!=="All" && c.branch!==f.branch) return false;
    if(f.from!=="All"   && c.from_officer!==f.from) return false;
    if(f.to!=="All"     && c.to_officer!==f.to) return false;
    if(f.comp!=="All"   && c.loan_component!==f.comp) return false;
    if(f.elig!=="All"   && c.eligibility_result!==f.elig) return false;
    if(f.flagged        && !c.overdue_flag) return false;
    return true;
  });
}

  /* 11 */
  const repeat=r2.filter(x=>x.flagged>=2);
  const qMonths=r3.filter(m=>["03","06","09","12"].indexOf(m.key.slice(5))!==-1);
  const qRate=qMonths.length?pct(qMonths.reduce((a,m)=>a+m.flagged,0),qMonths.reduce((a,m)=>a+m.n,0)):0;
  const nRate=pct(rows.filter(c=>c.overdue_flag).length,rows.length);
  const routes=r6.filter(x=>x.flagged>=2&&x.distinct>=2);
  html+=card("11 · Systemic Patterns Summary","The three cross-run signals, read together.",
    '<div class="grid2">'
    +'<div class="section-card" style="box-shadow:none;margin:0"><div class="section-card-title">Repeat offenders</div>'
    +'<div class="metric-card-value">'+repeat.length+'</div>'
    +'<div class="cap">requesters with 2 or more overdue submissions</div></div>'
    +'<div class="section-card" style="box-shadow:none;margin:0"><div class="section-card-title">Quarter-end skew</div>'
    +'<div class="metric-card-value">'+qRate+'%</div>'
    +'<div class="cap">overdue rate in Mar/Jun/Sep/Dec vs '+nRate+'% overall</div></div>'
    +'<div class="section-card" style="box-shadow:none;margin:0"><div class="section-card-title">Persistent routes</div>'
    +'<div class="metric-card-value">'+routes.length+'</div>'
    +'<div class="cap">officer pairs carrying overdue in 2 or more runs</div></div>'
    +'</div>'
    +'<button class="btn" id="expReport" type="button" style="margin-top:.8rem">⬇  Export current selection (CSV)</button>');
  return html;
}

function admPatterns(){
  const checks=DB.checks;
  const by=(keyfn)=>{const m={};checks.forEach(function(r){const k=keyfn(r)||"(not recorded)";(m[k]=m[k]||[]).push(r);});return m;};
  /* 1 — Repeat Offender Watch */
  const g=by(r=>r.requested_by);
  const repeat=Object.keys(g).map(function(k){
    const v=g[k], od=v.filter(x=>x.overdue_flag);
    const runs={}; v.forEach(x=>runs[x.run_id]=1);
    const ds=v.map(x=>x.run_date).sort();
    return {key:k,total:v.length,overdue:od.length,
      notEligible:v.filter(x=>x.eligibility_result==="Not Eligible").length,
      amt:od.reduce((a,x)=>a+(+x.total_overdue||0),0),
      runs:Object.keys(runs).length,first:ds[0],last:ds[ds.length-1]};
  }).filter(x=>x.overdue>=2).sort((a,b)=>b.overdue-a.overdue||b.amt-a.amt);
  let html=card("Repeat Offender Watch",
    "Requesters who have submitted overdue members across multiple runs. A single person repeatedly "
    +"appearing here is the strongest indicator of deliberate PAR migration rather than isolated mistakes.",
    (repeat.length?table([{k:"key",label:"Requester"},{k:"total",label:"Total Submitted",num:true},
      {k:"overdue",label:"Overdue Submitted",num:true,cls:(r,v)=>v>=5?"sev-HIGH":(v>=2?"sev-MEDIUM":"")},
      {k:"notEligible",label:"Not Eligible",num:true},
      {k:"amt",label:"Overdue Amount Moved",num:true,fmt:money},
      {k:"runs",label:"Runs Involved",num:true},{k:"first",label:"First Seen"},{k:"last",label:"Last Seen"}],
      repeat,{height:300})+'<button class="btn" id="expRepeat" type="button" style="margin-top:.6rem">⬇  Export Repeat Offender list (CSV)</button>'
     :'<div class="alert alert-ok">No requesters found with 2 or more overdue submission(s). This is a healthy signal. ✓</div>'));
  /* 2 — Quarter-End Overdue Spike */
  const gm=by(r=>r.run_month);
  const months=Object.keys(gm).sort().map(function(k){
    const v=gm[k], od=v.filter(x=>x.overdue_flag);
    return {key:k,total:v.length,overdue:od.length,amt:od.reduce((a,x)=>a+(+x.total_overdue||0),0),
      q:["03","06","09","12"].indexOf(k.slice(5))!==-1};
  });
  const mx=Math.max.apply(null,months.map(m=>m.total).concat([1]));
  html+=card("Quarter-End Overdue Spike Analysis",
    "Monthly overdue transfer volume. Spikes in March, June, September, or December are the classic "
    +"portfolio window-dressing signal — overdue members rushed out before quarter-close to make PAR metrics look better.",
    '<div class="bars">'+months.map(function(m){
      return '<div class="b" title="'+esc(m.key)+'"><i style="height:'+Math.round(m.overdue/mx*100)+'px;background:#dc2626"></i>'
        +'<i style="height:'+Math.round((m.total-m.overdue)/mx*100)+'px;background:#2563eb"></i>'
        +'<b>'+esc(m.key.slice(2))+(m.q?" ★":"")+'</b></div>';}).join("")+'</div>'
    +'<div class="legend"><span><i style="background:#2563eb"></i>Total transfers</span>'
    +'<span><i style="background:#dc2626"></i>Overdue transfers</span></div>'
    +table([{k:"key",label:"Month"},{k:"total",label:"Total Transfers",num:true},
      {k:"overdue",label:"Overdue Transfers",num:true,cls:(r,v)=>v>0?"flagcell":""},
      {k:"amt",label:"Overdue Amount",num:true,fmt:money},
      {k:r=>r.q?"Yes":"No",label:"Quarter-End Month?",cls:(r,v)=>v==="Yes"?"sev-MEDIUM":""}],months,{height:260}));
  /* 3 — Persistent Officer Dumping Routes */
  const rm={};
  checks.forEach(function(r){
    const k=(r.from_officer||"?")+"||"+(r.to_officer||"?");
    const e=rm[k]||(rm[k]={from:r.from_officer,to:r.to_officer,total:0,overdue:0,amt:0,runs:{},last:""});
    e.total++; if(r.overdue_flag){e.overdue++;e.amt+=(+r.total_overdue||0);}
    e.runs[r.run_id]=1; if(r.run_date>e.last) e.last=r.run_date;
  });
  const routes=Object.keys(rm).map(k=>rm[k]).map(function(e){e.distinct=Object.keys(e.runs).length;return e;})
    .filter(e=>e.overdue>=2&&e.distinct>=2).sort((a,b)=>b.overdue-a.overdue);
  html+=card("Persistent Officer Dumping Routes",
    "Officer-to-officer transfer routes that repeatedly carry overdue members across multiple runs. "
    +"A route appearing in 2 or more runs with overdue balance is evidence of systemic dumping, not coincidence.",
    (routes.length?table([{k:"from",label:"From Officer"},{k:"to",label:"To Officer"},
      {k:"total",label:"Total Transfers",num:true},
      {k:"overdue",label:"Overdue Transfers",num:true,cls:(r,v)=>v>0?"flagcell":""},
      {k:"amt",label:"Overdue Amount",num:true,fmt:money},
      {k:"distinct",label:"Distinct Runs",num:true},{k:"last",label:"Last Seen"}],routes,{height:280})
      +'<button class="btn" id="expRoutes" type="button" style="margin-top:.6rem">⬇  Export Dumping Routes (CSV)</button>'
     :'<div class="alert alert-ok">No persistent routes found with 2 or more overdue transfer(s). ✓</div>'));
  return html;
}

let tourIdx=-1;
function clearHighlight(){
  document.querySelectorAll(".tour-highlight").forEach(e=>e.classList.remove("tour-highlight"));
}
function showTour(i){
  tourIdx=i;
  if(i<0||i>=TOUR.length){ endTour(); return; }
  const step=TOUR[i];
  if(step.go) step.go();
  render();
  clearHighlight();
  const el=document.querySelector(step.sel);
  if(el){ el.classList.add("tour-highlight"); el.scrollIntoView({behavior:"smooth",block:"center"}); }
  const root=document.getElementById("tourRoot");
  root.innerHTML='<div class="tourbox" role="dialog" aria-label="Guided tour step '+(i+1)+'">'
    +'<header><span class="n">'+(i+1)+' / '+TOUR.length+'</span> Guided tour'
    +'<span style="flex:1"></span>'
    +'<button type="button" id="tourX" style="background:transparent;border:0;color:#cbd5e1;cursor:pointer;font-size:1rem" aria-label="Close tour">×</button></header>'
    +'<div class="body"><h4>'+esc(step.t)+'</h4>'+esc(step.b)+'</div>'
    +'<div class="foot">'
    +'<button class="btn" id="tourPrev" type="button"'+(i===0?" disabled":"")+'>Back</button>'
    +'<button class="btn btn-primary" id="tourNext" type="button">'+(i===TOUR.length-1?"Finish":"Next")+'</button>'
    +'</div></div>';
  on("tourX","click",endTour);
  on("tourPrev","click",()=>showTour(i-1));
  on("tourNext","click",()=>showTour(i+1));
  const nx=document.getElementById("tourNext"); if(nx) nx.focus();
}
function endTour(){
  tourIdx=-1; clearHighlight();
  document.getElementById("tourRoot").innerHTML="";
}
document.addEventListener("keydown",function(e){
  if(tourIdx<0) return;
  if(e.key==="Escape") endTour();
  else if(e.key==="ArrowRight") showTour(tourIdx+1);
  else if(e.key==="ArrowLeft"&&tourIdx>0) showTour(tourIdx-1);
});

}
document.getElementById("roleSel").addEventListener("change",function(e){
  S.role=e.target.value;
  const role=ROLES[S.role];
  if(role.modes.indexOf(S.mode)===-1) S.mode="operations";
  if(S.mode==="admin"&&role.adminTabs.indexOf(S.adminTab)===-1) S.adminTab=role.adminTabs[0]||0;
  if(!role.canRun&&S.running) S.running=false;
  render();
});
document.getElementById("tourBtn").addEventListener("click",function(){ showTour(0); });
render();
</script>
</body>
</html>
